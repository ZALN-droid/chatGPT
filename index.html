<h3>Formulation architecture</h3>

<p>A reasonable starting research formulation would be:</p>

<p><strong>Dopamine HCl → chitosan/TPP nanoparticles → aqueous nasal dispersion</strong></p>

<p>The nanoparticles would generally be produced using ionic gelation, where protonated chitosan interacts electrostatically with TPP, forming nanoscale particles in which dopamine is incorporated during particle formation.</p>

<p>For development, the important variables to optimize would include:</p>

/* =========================================================
   DEMO FUNCTIONS
   ========================================================= */

let currentQuestion = 1;

function startDemo() {
    document.getElementById("startScreen").classList.add("hidden");
    startQuestion(1);
}


/* TYPE PROMPT INTO BOTTOM BOX */

function typeText(text, callback) {
    const prompt = document.getElementById("promptText");
    prompt.textContent = "";

    let i = 0;

    const interval = setInterval(() => {
        prompt.textContent += text[i];
        i++;

        if (i >= text.length) {
            clearInterval(interval);

            setTimeout(() => {
                callback();
            }, 500);
        }
    }, 22);
}


/* AUTO SCROLL */

function autoScroll() {
    const container = document.getElementById("chatContainer");

    container.scrollTo({
        top: container.scrollHeight,
        behavior: "smooth"
    });
}


/* START QUESTION */

function startQuestion(number) {

    const question = number === 1 ? question1 : question2;
    const response = number === 1 ? response1 : response2;

    typeText(question, () => {

        /* Clear bottom prompt */
        document.getElementById("promptText").textContent = "";

        /* USER MESSAGE */
        const chat = document.getElementById("chat");

        const userRow = document.createElement("div");
        userRow.className = "user-row";

        const userMessage = document.createElement("div");
        userMessage.className = "user-message";
        userMessage.textContent = question;

        userRow.appendChild(userMessage);
        chat.appendChild(userRow);

        autoScroll();

        /* Fake sending delay */
        setTimeout(() => {

            const assistantRow = document.createElement("div");
            assistantRow.className = "assistant-row";

            const logo = document.createElement("img");
            logo.className = "assistant-logo";
            logo.src = "chatgpt-logo.png";

            const content = document.createElement("div");
            content.className = "assistant-content";

            assistantRow.appendChild(logo);
            assistantRow.appendChild(content);

            chat.appendChild(assistantRow);

            createFormattedResponse(response, number);

        }, 700);
    });
}


/* CREATE RESPONSE */

function createFormattedResponse(html, number) {

    const assistantContent =
        document.querySelector(
            "#chat .assistant-row:last-child .assistant-content"
        );

    revealHTML(
        assistantContent,
        html,
        () => finishQuestion(number)
    );
}


/* REVEAL HTML */

function revealHTML(container, html, callback) {

    /*
       Break response into HTML blocks.

       Tables are treated as complete units so that
       they render properly instead of being typed
       character-by-character.
    */

    const temp = document.createElement("div");
    temp.innerHTML = html;

    const blocks = Array.from(temp.children);

    let index = 0;

    function showNextBlock() {

        if (index >= blocks.length) {

            const cursor =
                container.querySelector(".cursor");

            if (cursor) {
                cursor.remove();
            }

            callback();
            return;
        }

        const block = blocks[index];

        /*
           Tables and large sections appear as complete
           formatted blocks.
        */

        const clone = block.cloneNode(true);

        container.appendChild(clone);

        index++;

        autoScroll();

        let delay = 90;

        if (
            block.tagName === "TABLE" ||
            block.querySelector("table")
        ) {
            delay = 350;
        }

        if (
            block.tagName === "UL" ||
            block.tagName === "OL"
        ) {
            delay = 220;
        }

        if (
            block.tagName === "H2" ||
            block.tagName === "H3"
        ) {
            delay = 180;
        }

        setTimeout(showNextBlock, delay);
    }

    showNextBlock();
}


/* FINISH QUESTION */

function finishQuestion(number) {

    if (number === 1) {

        const chat = document.getElementById("chat");

        const button = document.createElement("button");
        button.className = "continue-button";
        button.textContent = "Continue";

        button.onclick = () => {
            button.remove();
            currentQuestion = 2;
            startQuestion(2);
        };

        chat.appendChild(button);

        autoScroll();
    }
}

</script>
