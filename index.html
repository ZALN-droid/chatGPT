<!DOCTYPE html>
<html lang="en">
<head>

<title>ChatGPT Presentation Demo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

    color: #ececec;
    height: 100vh;
    overflow: hidden;

/* =====================================================
   HEADER
===================================================== */

.header {
    height: 60px;
    display: flex;
    align-items: center;
    padding: 0 22px;

    background: #212121;
}

.header-logo {
    width: 32px;
    height: 32px;
    object-fit: contain;
    margin-right: 10px;
}

.title {
    font-size: 17px;
    font-weight: 600;
    color: #ececec;
}


/* =====================================================
   CHAT AREA
===================================================== */

.chat {
    position: absolute;
    top: 60px;
    bottom: 105px;
    left: 0;
    right: 0;

    overflow-y: auto;

    padding: 40px 20px 80px;

    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar {
    width: 8px;
}

.chat::-webkit-scrollbar-track {
    background: #212121;
}

.chat::-webkit-scrollbar-thumb {
    background: #4a4a4a;
    border-radius: 10px;
}

.conversation {
    max-width: 900px;
    margin: auto;
}


/* =====================================================
   USER MESSAGE
===================================================== */

.user-message {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 30px;
}

.user-bubble {
    max-width: 75%;
    background: #303030;
    padding: 12px 18px;
    border-radius: 18px;
    font-size: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
    color: #ececec;
}


/* =====================================================
   ASSISTANT MESSAGE
===================================================== */

.assistant-message {
    display: flex;
    align-items: flex-start;

    margin-bottom: 45px;

.assistant-logo {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    object-fit: contain;
}

.response {
    font-size: 16px;
    line-height: 1.65;
    max-width: 820px;
    color: #ececec;
}

===================================================== */

.response li {

===================================================== */

.response table {
    width: 100%;
    border-collapse: collapse;

    background: #2a2a2a;

    font-size: 13px;

    line-height: 1.45;

.response th {
    background: #3a3a3a;
    color: #ffffff;

.response tr:nth-child(even) td {

===================================================== */

.cursor {

/* =====================================================
   TYPE PLAIN TEXT
===================================================== */

function typeText(
    element,
    text,
    speed,
    callback
) {

    let index = 0;

    function type() {

        if (index < text.length) {

            element.textContent +=
                text.charAt(index);

            index++;

            autoScroll();

            setTimeout(type, speed);

        } else {

            if (callback) {
                callback();
            }

        }
    }

    type();
}



/* =====================================================
   AUTO SCROLL
===================================================== */

function autoScroll() {

    const chat =
        document.getElementById("chat");

    chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"

}

                        "user-message";


                    user.innerHTML = `

                        <div class="user-bubble">

                            ${escapeHTML(
                                prompt.trim()
                            )}

                        </div>

                    `;


                    conversation.appendChild(user);


                    /* Clear prompt */

                    document.getElementById(
                        "typingText"
                    ).textContent = "";


                    document.getElementById(
                        "cursor"
                    ).style.display = "none";


                    autoScroll();



                    /* ==================================
                       WAIT THEN RESPONSE
                    ================================== */

                    setTimeout(function() {

                        /*
                           Response 1:
                           original plain-text animation.

                           Response 2:
                           formatted HTML response.
                        */

                        if (number === 1) {

                            createPlainResponse(
                                response,
                                number
                            );

                        } else {

                            createFormattedResponse(
                                response,
                                number
                            );

                        }

                    }, pauseBeforeResponse);


                }, 180);

            }, 400);

        }

    );
}



/* =====================================================
   RESPONSE 1
   ORIGINAL STYLE
===================================================== */

function createPlainResponse(
    response,
    number
) {

    const conversation =
        document.getElementById(
            "conversation"
        );


    const assistant =
        document.createElement("div");


    assistant.className =
        "assistant-message";


    assistant.innerHTML = `

        <img
            src="chatgpt-logo.png"
            class="assistant-logo"
            alt="ChatGPT"
        >

        <div class="response">

            <span class="response-text"></span>

            <span
                class="cursor response-cursor"
            ></span>

        </div>

    `;


    conversation.appendChild(assistant);


    const text =
        assistant.querySelector(
            ".response-text"
        );


    const cursor =
        assistant.querySelector(
            ".response-cursor"
        );


    typeText(

        text,

        response.trim(),

        responseTypingSpeed,

        function() {

            cursor.style.display = "none";

            finishQuestion(number);

        }

    );
}



/* =====================================================
   FORMATTED RESPONSE 2
===================================================== */

function createFormattedResponse(
    html,
    number
) {

    const conversation =
        document.getElementById(
            "conversation"
        );


    const assistant =
        document.createElement("div");


    assistant.className =
        "assistant-message";


    assistant.innerHTML = `

        <img
            src="chatgpt-logo.png"
            class="assistant-logo"
            alt="ChatGPT"
        >

        <div class="response">

            <div
                class="formatted-response"
                id="formattedResponse"
            ></div>

            <span
                class="cursor response-cursor"
                id="formattedCursor"
            ></span>

        </div>

    `;


    conversation.appendChild(assistant);


    const container =
        assistant.querySelector(
            ".formatted-response"
        );


    const cursor =
        assistant.querySelector(
            ".response-cursor"
        );


    /*
       Instead of typing raw HTML characters,
       reveal the response section-by-section.
    */

    revealHTML(
        container,
        html,
        function() {

            cursor.style.display = "none";

            finishQuestion(number);

        }
    );
}



/* =====================================================
   REVEAL FORMATTED HTML
===================================================== */

function revealHTML(
    container,
    html,
    callback
) {

    /*
       Parse the response into a temporary
       HTML document.
    */

    const temp =
        document.createElement("div");

    temp.innerHTML = html;


    const elements =
        Array.from(temp.childNodes);


    let index = 0;


    function revealNext() {

        if (index >= elements.length) {

            if (callback) {
                callback();
            }

            return;
        }


        const element =
            elements[index];


        /*
           Clone the element into the
           actual response.
        */

        const clone =
            element.cloneNode(true);


        container.appendChild(clone);


        index++;


        /*
           Scroll after each section.
        */

        autoScroll();


        /*
           Tables appear as complete,
           readable tables rather than
           one character at a time.
        */

        let delay = 180;


        if (
            clone.nodeType === 1 &&
            (
                clone.tagName === "TABLE" ||
                clone.querySelector &&
                clone.querySelector("table")
            )
        ) {

            delay = 500;

        }


        if (
            clone.nodeType === 1 &&
            clone.tagName === "P"
        ) {

            delay = 450;

        }


        if (
            clone.nodeType === 1 &&
            (
                clone.tagName === "H2" ||
                clone.tagName === "H3"
            )
        ) {

            delay = 400;

        }


        setTimeout(
            revealNext,
            delay
        );

    }


    revealNext();
}



/* =====================================================
   FINISH QUESTION
===================================================== */

function finishQuestion(number) {

    if (number === 1) {

        setTimeout(function() {

            document.getElementById(
                "nextButton"
            ).style.display = "block";

        }, 500);

    }


    if (number === 2) {

        console.log(
            "Demo complete."
        );

    }

}



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return text

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
